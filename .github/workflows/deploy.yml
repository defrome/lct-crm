name: Test deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-deploy
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy app

      - name: Tests
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
          ENV: local
          AUTH_MODE: dev
        run: pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` — это `tsc -b && vite build`, то есть проверка типов
      # и сборка одним шагом: собранный образ не разойдётся с проверками.
      - name: Type check and build
        run: npm run build

  deploy:
    name: Deploy to test server
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure SSH host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/docker/keycloak' '$DEPLOY_PATH/docker/prometheus' \
              '$DEPLOY_PATH/docker/grafana/provisioning' '$DEPLOY_PATH/docker/grafana/dashboards'; \
              if [ -d '$DEPLOY_PATH/docker/prometheus/prometheus.yml' ]; then \
                rmdir '$DEPLOY_PATH/docker/prometheus/prometheus.yml'; \
              fi"
          scp -P "${DEPLOY_PORT:-22}" docker-compose.deploy.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.deploy.yml"
          # Mirror build contexts so files deleted in Git are not retained in
          # a previous server-side Docker build context.
          rsync -az --delete -e "ssh -p ${DEPLOY_PORT:-22}" backend/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/backend/"
          rsync -az --delete -e "ssh -p ${DEPLOY_PORT:-22}" frontend/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/frontend/"
          scp -P "${DEPLOY_PORT:-22}" docker/Caddyfile \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker/Caddyfile"
          scp -P "${DEPLOY_PORT:-22}" docker/prometheus/prometheus.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker/prometheus/prometheus.yml"
          scp -P "${DEPLOY_PORT:-22}" -r docker/grafana/provisioning docker/grafana/dashboards \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker/grafana/"
          scp -P "${DEPLOY_PORT:-22}" docker/keycloak/realm-production.json \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker/keycloak/realm-production.json"
          scp -P "${DEPLOY_PORT:-22}" docker/keycloak/crm-web-client.json docker/keycloak/ensure-crm-web-client.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker/keycloak/"

      - name: Deploy local build
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"

          cd "$deploy_path"
          if [ ! -f .env ]; then
            echo "Deployment configuration .env is missing in $deploy_path" >&2
            exit 1
          fi

          # Recreate every service on each deployment so changed images and
          # configuration are applied immediately. API and web images are
          # built locally from the source uploaded by this workflow. Volumes
          # are deliberately preserved, so database and monitoring data survive.
          if ! docker compose -f docker-compose.deploy.yml up -d --no-build --force-recreate db minio redis mailpit; then
            echo "compose startup failed; recent container logs follow"
            docker compose -f docker-compose.deploy.yml ps || true
            docker compose -f docker-compose.deploy.yml logs --tail=100 db minio redis mailpit || true
            exit 1
          fi

          if ! docker compose -f docker-compose.deploy.yml up -d --no-build --force-recreate keycloak; then
            echo "Keycloak startup failed; recent container logs follow"
            docker compose -f docker-compose.deploy.yml ps || true
            docker compose -f docker-compose.deploy.yml logs --tail=100 keycloak || true
            exit 1
          fi

          # Realm imports are only applied to a new Keycloak database. Run the
          # idempotent reconciliation explicitly so existing deployments get
          # the browser client and the current application redirect URI too.
          if ! docker compose -f docker-compose.deploy.yml run --rm keycloak-bootstrap; then
            echo "Keycloak client bootstrap failed; recent Keycloak logs follow"
            docker compose -f docker-compose.deploy.yml logs --tail=100 keycloak || true
            exit 1
          fi

          if ! docker compose -f docker-compose.deploy.yml up -d --build --no-deps --force-recreate api web; then
            echo "compose startup failed; recent container logs follow"
            docker compose -f docker-compose.deploy.yml ps || true
            docker compose -f docker-compose.deploy.yml logs --tail=100 db keycloak api web caddy || true
            exit 1
          fi

          for attempt in $(seq 1 30); do
            api_health="$(docker inspect --format '{{.State.Health.Status}}' crm-api 2>/dev/null || true)"
            web_health="$(docker inspect --format '{{.State.Health.Status}}' crm-web 2>/dev/null || true)"
            if [ "$api_health" = "healthy" ] && [ "$web_health" = "healthy" ]; then
              echo "api and web are healthy"
              break
            fi
            if [ "$api_health" = "unhealthy" ] || [ "$web_health" = "unhealthy" ]; then
              docker compose -f docker-compose.deploy.yml logs --tail=100 api web
              exit 1
            fi
            sleep 2
          done

          if [ "$api_health" != "healthy" ] || [ "$web_health" != "healthy" ]; then
            docker compose -f docker-compose.deploy.yml logs --tail=100 api web
            exit 1
          fi

          # Monitoring services are not dependencies of the API. Start them
          # explicitly before Caddy so its reverse proxy can resolve grafana
          # through Docker DNS as soon as the public endpoint is available.
          if ! docker compose -f docker-compose.deploy.yml up -d --no-build --force-recreate prometheus grafana; then
            echo "monitoring startup failed; recent container logs follow"
            docker compose -f docker-compose.deploy.yml logs --tail=100 prometheus grafana || true
            exit 1
          fi

          sleep 2
          for container in crm-prometheus crm-grafana; do
            if [ "$(docker inspect --format '{{.State.Running}}' "$container" 2>/dev/null || true)" != "true" ]; then
              echo "$container stopped after startup; recent container logs follow"
              docker compose -f docker-compose.deploy.yml logs --tail=100 prometheus grafana || true
              exit 1
            fi
          done

          # Caddy expands DOMAIN, KEYCLOAK_DOMAIN and GRAFANA_DOMAIN only when
          # it starts. Recreate it to pick up the current values and Caddyfile;
          # otherwise a container created before a new domain was added may
          # expand a site label to an empty string and reject the Caddyfile.
          #
          # This deployment owns ports 80 and 443 through the caddy service.
          # A legacy host-level Caddy service uses the same ports and prevents
          # Docker from starting crm-caddy, so stop and disable it when present.
          if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet caddy; then
            echo "stopping legacy host caddy service so crm-caddy can bind ports 80 and 443"
            systemctl disable --now caddy
          fi

          if ! docker compose -f docker-compose.deploy.yml up -d --no-build --no-deps --force-recreate caddy; then
            echo "caddy startup failed; recent container logs follow"
            echo "processes publishing port 80:"
            docker ps --filter publish=80 --format 'table {{.Names}}\t{{.Ports}}' || true
            docker compose -f docker-compose.deploy.yml logs --tail=100 caddy || true
            exit 1
          fi

          sleep 2
          if [ "$(docker inspect --format '{{.State.Running}}' crm-caddy 2>/dev/null || true)" != "true" ]; then
            echo "caddy stopped after startup; recent container logs follow"
            docker compose -f docker-compose.deploy.yml logs --tail=100 caddy || true
            exit 1
          fi

          # Reclaim disk space from previous releases only after the new
          # application stack is healthy. --all also removes unused tagged
          # SHA images and build cache. Volumes are deliberately preserved:
          # they contain application data, TLS certificates and monitoring
          # history.
          docker system prune --all --force

          docker compose -f docker-compose.deploy.yml ps
          REMOTE
