# Serves the SPA and proxies the two back-end origins under the same host.
#
# Proxying rather than calling them directly is deliberate: the API ships no
# CORS middleware, and the Keycloak realm client whitelists one web origin. With
# everything behind this server the browser only ever sees same-origin requests,
# and the same relative URLs work in development (Vite's proxy) and production.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Hashed assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass ${API_ORIGIN};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Catalogue uploads are allowed up to 20 MB by the API.
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }

    # Swagger, ReDoc, схема и health-check отдаются самим API, но лежат не под
    # /api/. Без этих правил они попали бы в catch-all ниже и вернули index.html
    # вместо документации.
    location ~ ^/(docs|redoc|openapi\.json|health) {
        proxy_pass ${API_ORIGIN};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kc/ {
        rewrite ^/kc/(.*)$ /$1 break;
        proxy_pass ${KEYCLOAK_ORIGIN};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: any unknown path is a route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
