services:
  db:
    image: postgres:16-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      # Collation matters for ORDER BY on Cyrillic names.
      LANG: ru_RU.utf8
    ports:
      - "${POSTGRES_EXPOSED_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: crm-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Fixes the `iss` claim to this value no matter which hostname the
      # request came in on (the api container reaches Keycloak as
      # `keycloak:8080`, the browser/Swagger as `localhost:8080` — without
      # this they'd disagree and token validation would fail on `iss`).
      # Полный URL, а не просто хост: иначе issuer собирается из заголовка Host
      # запроса, и токен, полученный через прокси веб-интерфейса (Host
      # localhost:5173), получает `iss` без порта — API такой токен отвергает.
      # Для прямых обращений на :8080 значение issuer не меняется.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  # Realm import is deliberately non-destructive and therefore does not update
  # an existing database. This one-shot service reconciles the browser client.
  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.0
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    entrypoint: ["/bin/sh", "/opt/keycloak/data/import/ensure-crm-web-client.sh"]
    volumes:
      - ./docker/keycloak/crm-web-client.json:/opt/keycloak/data/import/crm-web-client.json:ro
      - ./docker/keycloak/ensure-crm-web-client.sh:/opt/keycloak/data/import/ensure-crm-web-client.sh:ro
    restart: "no"

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: crm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: crm-redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Development-only SMTP sink. Messages never leave the Compose network;
  # inspect captured messages through the UI bound to localhost.
  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: crm-mailpit
    command: ["--smtp=0.0.0.0:1025"]
    expose:
      - "1025"
    ports:
      - "${MAILPIT_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: crm-api
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      ENV: ${ENV:-local}
      AUTH_MODE: ${AUTH_MODE:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      SEED_ON_START: ${SEED_ON_START:-true}
      # Как и в проде: тот же адрес, что уходит в KC_HOSTNAME, поэтому
      # issuer в токене и ожидаемый API issuer не могут разойтись.
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/crm
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      # Hardcoded, not read from .env: inside the compose network this
      # container must reach Keycloak by its service name. `.env` typically
      # holds the `localhost:8080` JWKS URL for the "run uvicorn on the host"
      # workflow — substituting that in here would make this container try
      # to dial itself and fail every token check with a connection error
      # (same reasoning as hardcoding POSTGRES_HOST above).
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/crm/protocol/openid-connect/certs
      # Интеграции: без заданных URL источники работают на демонстрационных данных.
      INTEGRATIONS_MODE: ${INTEGRATIONS_MODE:-fixture}
      LMS_API_URL: ${LMS_API_URL:-}
      LMS_API_TOKEN: ${LMS_API_TOKEN:-}
      WEBSITE_API_URL: ${WEBSITE_API_URL:-}
      WEBSITE_API_TOKEN: ${WEBSITE_API_TOKEN:-}
      OBJECT_STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:-crm-files}
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      CACHE_BACKEND: ${CACHE_BACKEND:-redis}
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      FEATURE_CACHE_ENABLED: ${FEATURE_CACHE_ENABLED:-false}
      FEATURE_NOTIFICATIONS_ENABLED: ${FEATURE_NOTIFICATIONS_ENABLED:-false}
      FEATURE_EXTERNAL_CHANNELS_ENABLED: ${FEATURE_EXTERNAL_CHANNELS_ENABLED:-false}
      FEATURE_CHAT_ENABLED: ${FEATURE_CHAT_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./frontend
    container_name: crm-web
    depends_on:
      api:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
    environment:
      # nginx внутри контейнера проксирует эти два origin'а под своим доменом,
      # поэтому браузер видит только same-origin запросы: у API нет CORS, а в
      # realm Keycloak прописан один web origin.
      API_ORIGIN: http://api:8000
      KEYCLOAK_ORIGIN: http://keycloak:8080
    ports:
      - "${WEB_PORT:-5173}:80"
    healthcheck:
      # 127.0.0.1, а не localhost: nginx слушает только IPv4, а busybox-wget
      # резолвит localhost сначала в ::1 и получает connection refused.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: crm-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}"
      - "--web.enable-lifecycle"
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0-slim
    container_name: crm-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:${GRAFANA_PORT:-3000}}
    ports:
      - "${MONITORING_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  redis-data:
  prometheus-data:
  grafana-data:
